[package]
name = "crate-dependent-repos"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Evidence-oriented inventory of repositories that declare or resolve a Cargo crate version"
publish = false

[dependencies]
aes-gcm = "0.11.0"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
cargo-lock = { version = "11.1.0", features = ["dependency-tree"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
csv = "1.4.0"
futures = "0.3.33"
indicatif = "0.17"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["rt-tokio", "trace"] }
prometheus-client = "0.25.0"
rcgen = "0.14.9"
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["gzip", "json", "query", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spdx = "0.13.5"
strsim = "0.11.1"
tempfile = "3.23.0"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.4"
tower = "0.5.3"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
turso = { version = "=0.8.0-pre.4", default-features = false }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
x509-parser = "0.18.1"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
