[package]
name = "crate-dependent-repos"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Evidence-oriented inventory of repositories that declare or resolve a Cargo crate version"
publish = false

[dependencies]
anyhow = "1.0.104"
cargo-lock = { version = "11.1.0", features = ["dependency-tree"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
csv = "1.4.0"
futures = "0.3.33"
reqwest = { version = "0.13.4", features = ["gzip", "json", "query"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.4"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
